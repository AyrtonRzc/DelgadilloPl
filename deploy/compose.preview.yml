# DelgadilloPl: private, isolated static preview only.
# No builds, database, ERP network, public ports or new image pulls.
# Uses caddy:2-alpine already present on the ERP VPS.
services:
  web:
    image: caddy:2-alpine
    pull_policy: never
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.20
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - type: bind
        source: ${DELGADILLOPL_SITE_DIR:?Set absolute static site directory}
        target: /srv
        read_only: true
    environment:
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
